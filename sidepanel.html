<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Explainer - Offline Engine</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Encabezado superior -->
  <header class="app-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
      <h1>Code Explainer</h1>
    </div>
    <div class="engine-badge" title="Motor autónomo 100% local en JavaScript. Sin APIs, sin esperas y sin conexión a internet.">
      <span class="badge-dot"></span>
      <span>Motor Local Activo</span>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="main-container">
    <!-- Visualizador y Editor de Código -->
    <section class="panel-section">
      <div class="section-header">
        <span class="section-title">Código a Analizar</span>
        <div class="header-actions">
          <button id="pasteCodeBtn" class="text-btn" title="Pegar del portapapeles">Pegar</button>
          <button id="clearCodeBtn" class="text-btn" title="Limpiar código">Limpiar</button>
        </div>
      </div>
      <div class="code-editor-wrapper">
        <textarea
          id="codeInput"
          placeholder="Selecciona código en una página web (clic derecho) o escribe/pega aquí tu código directamente..."
          spellcheck="false"
        ></textarea>
      </div>
      <div class="code-meta-bar">
        <span id="detectedLangTag" class="meta-tag">Lenguaje: Auto</span>
        <span id="linesCountTag" class="meta-tag">0 líneas</span>
      </div>
    </section>

    <!-- Barra de Acciones y Modos -->
    <section class="panel-section actions-section">
      <div class="action-buttons-grid">
        <button id="btnExplain" class="btn btn-action" data-mode="explain">
          <span class="btn-icon">💡</span>
          <span>Explicar lógica</span>
        </button>
        <button id="btnBugs" class="btn btn-action" data-mode="bugs">
          <span class="btn-icon">🔍</span>
          <span>Buscar bugs</span>
        </button>
      </div>

      <div class="refactor-container">
        <div class="target-lang-row">
          <select id="targetLangSelect" class="select-input">
            <option value="TypeScript">Convertir a TypeScript (Clean Code)</option>
            <option value="JavaScript Moderno">Modernizar a JavaScript ES2024</option>
            <option value="Python">Traducir a Python 3</option>
            <option value="Documentado">Generar JSDoc / Docstrings</option>
          </select>
        </div>
        <button id="btnRefactor" class="btn btn-action btn-refactor" data-mode="refactor">
          <span class="btn-icon">⚡</span>
          <span>Refactorizar / Convertir</span>
        </button>
      </div>
    </section>

    <!-- Área de Salida -->
    <section class="panel-section output-section">
      <div class="section-header">
        <span id="outputTitle" class="section-title">Resultado del Análisis</span>
        <button id="copyOutputBtn" class="text-btn hidden" title="Copiar al portapapeles">Copiar</button>
      </div>
      <div id="output" class="output-area">
        <p class="placeholder-text">Selecciona o pega código arriba y pulsa uno de los botones para ver el análisis instantáneo.</p>
      </div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
