<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SidePanel Prompt & Code Explainer</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Encabezado superior -->
  <header class="app-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
      <h1>Code Explainer</h1>
    </div>
    <button id="toggleSettingsBtn" class="icon-btn" title="Configuración de API Key" aria-label="Configuración">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- Panel colapsable de Configuración -->
  <section id="settingsPanel" class="settings-panel hidden">
    <div class="field-group">
      <label for="apiKeyInput">Google Gemini API Key</label>
      <div class="input-row">
        <input
          type="password"
          id="apiKeyInput"
          placeholder="Pega tu API Key de Gemini..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="saveKeyBtn" class="btn btn-primary btn-sm">Guardar</button>
      </div>
      <div class="field-group-sub">
        <label for="modelSelect">Modelo:</label>
        <select id="modelSelect" class="select-input">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Rápido y eficiente)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (Razonamiento profundo)</option>
        </select>
      </div>
      <p id="keyStatusMsg" class="status-msg"></p>
    </div>
  </section>

  <!-- Contenedor Principal -->
  <main class="main-container">
    <!-- Visualizador de Código Seleccionado -->
    <section class="panel-section">
      <div class="section-header">
        <span class="section-title">Código Seleccionado</span>
        <button id="clearCodeBtn" class="text-btn" title="Limpiar selección">Limpiar</button>
      </div>
      <div class="code-preview-wrapper">
        <pre id="codePre"><code id="selectedCodeBlock" class="empty-code">Selecciona un fragmento de código en cualquier página web, haz clic derecho y pulsa "Analizar con Code Explainer"...</code></pre>
      </div>
    </section>

    <!-- Barra de Acciones y Modos -->
    <section class="panel-section actions-section">
      <div class="action-buttons-grid">
        <button id="btnExplain" class="btn btn-action" data-mode="explain">
          <span class="btn-icon">💡</span>
          <span>Explicar lógica</span>
        </button>
        <button id="btnBugs" class="btn btn-action" data-mode="bugs">
          <span class="btn-icon">🔍</span>
          <span>Buscar bugs</span>
        </button>
      </div>

      <div class="refactor-container">
        <div class="target-lang-row">
          <input
            type="text"
            id="targetLangInput"
            list="langSuggestions"
            placeholder="Lenguaje destino (ej. TypeScript, Python, Rust...)"
            value="TypeScript"
          />
          <datalist id="langSuggestions">
            <option value="TypeScript"></option>
            <option value="JavaScript (ES6+)"></option>
            <option value="Python"></option>
            <option value="Rust"></option>
            <option value="Go"></option>
            <option value="C#"></option>
            <option value="Java"></option>
            <option value="C++"></option>
          </datalist>
        </div>
        <button id="btnRefactor" class="btn btn-action btn-refactor" data-mode="refactor">
          <span class="btn-icon">⚡</span>
          <span>Refactorizar / Convertir</span>
        </button>
      </div>
    </section>

    <!-- Indicador de Carga -->
    <div id="loadingIndicator" class="loading-container hidden" role="status" aria-live="polite">
      <div class="spinner"></div>
      <span id="loadingText">Analizando código con IA...</span>
    </div>

    <!-- Área de Salida -->
    <section class="panel-section output-section">
      <div class="section-header">
        <span id="outputTitle" class="section-title">Resultado</span>
        <button id="copyOutputBtn" class="text-btn hidden" title="Copiar análisis al portapapeles">Copiar</button>
      </div>
      <div id="output" class="output-area">
        <p class="placeholder-text">Los resultados del análisis aparecerán aquí.</p>
      </div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
